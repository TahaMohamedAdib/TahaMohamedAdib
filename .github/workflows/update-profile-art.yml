name: Update profile art

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-profile-art.yml"
      - "scripts/**"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile-art:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate live profile art
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py
          python scripts/render_ascii_avatar.py

      - name: Commit refreshed profile art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg taha-ascii.svg
          if git diff --cached --quiet; then
            echo "No profile changes"
          else
            git commit -m "chore: refresh animated profile art [skip ci]"
            git push
          fi
